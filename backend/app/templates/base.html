<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        VLESS Admin
        {% endblock %}
    </title>

    <script
        src="https://unpkg.com/htmx.org/dist/htmx.min.js">
    </script>

    <style>
        :root {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color-scheme: light dark;
        }

        body {
            margin: 0;
            padding: 0;
        }

        header {
            padding: 14px 24px;
            border-bottom: 1px solid #8885;
        }

        header nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        a {
            color: inherit;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #8885;
            text-align: left;
            vertical-align: middle;
        }

        th {
            white-space: nowrap;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button,
        .button {
            display: inline-block;
            box-sizing: border-box;
            padding: 7px 11px;
            border: 1px solid #8888;
            border-radius: 5px;
            background: transparent;
            color: inherit;
            cursor: pointer;
            text-decoration: none;
            font: inherit;
        }

        button:hover,
        .button:hover {
            background: #8882;
        }

        .danger {
            border-color: #c33;
        }

        .enabled {
            font-weight: 600;
        }

        .disabled {
            opacity: .55;
        }

        code {
            font-family: monospace;
        }

        .token {
            font-size: .8em;
            overflow-wrap: anywhere;
        }

        .toolbar {
            margin-bottom: 20px;
        }

        .form {
            max-width: 700px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .field input[type="text"],
        .field input[type="email"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            font: inherit;
        }

        .error {
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #c33;
            border-radius: 5px;
        }

        .muted {
            opacity: .65;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <strong>VLESS Admin</strong>

        <a href="/admin/users">
            Users
        </a>

        <a href="/admin/servers">
            Servers
        </a>

        <a href="/admin/assignments">
            Assignments
        </a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>

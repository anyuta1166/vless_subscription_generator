{% extends "base.html" %}

{% block title %}
Users — VLESS Admin
{% endblock %}


{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Users</h1>

    <a
        class="btn btn-primary"
        href="/admin/users/new"
    >
        Add user
    </a>
</div>


<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">

        <thead>
            <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subscription URL</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for user in users %}
                {% include "users/_row.html" %}
            {% else %}
                <tr>
                    <td
                        colspan="7"
                        class="text-center text-body-secondary"
                    >
                        No users
                    </td>
                </tr>
            {% endfor %}

        </tbody>

    </table>
</div>

{% endblock %}

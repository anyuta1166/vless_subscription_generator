<tr
    id="user-row-{{ user.id }}"
    class="{% if not user.enabled %}opacity-50{% endif %}"
>
    <td>
        {{ user.id }}
    </td>

    <td>
        <code>{{ user.user_id }}</code>
    </td>

    <td>
        {{ user.display_name }}
    </td>

    <td>
        {{ user.email }}
    </td>

    <td class="subscription-url">

        {% set subscription_url =
            public_base_url ~ "/sub/" ~ user.subscription_token
        %}

        <div class="d-flex gap-2 align-items-center">

            <code
                id="subscription-url-{{ user.id }}"
                class="small"
            >
                {{ subscription_url }}
            </code>

            <button
                type="button"
                class="btn btn-sm btn-outline-secondary text-nowrap flex-shrink-0"
                onclick="
                    const button = this;

                    navigator.clipboard.writeText(
                        document
                            .getElementById('subscription-url-{{ user.id }}')
                            .textContent
                            .trim()
                    ).then(() => {
                        const originalText = button.textContent;

                        button.textContent = 'Copied!';
                        button.classList.remove('btn-outline-secondary');
                        button.classList.add('btn-success');

                        setTimeout(() => {
                            button.textContent = originalText;
                            button.classList.remove('btn-success');
                            button.classList.add('btn-outline-secondary');
                        }, 1500);
                    });
                "
            >
                Copy
            </button>

        </div>

    </td>

    <td>
        {% if user.enabled %}
            <span class="badge text-bg-success">
                Enabled
            </span>
        {% else %}
            <span class="badge text-bg-secondary">
                Disabled
            </span>
        {% endif %}
    </td>

    <td>
        <div class="d-flex gap-2 flex-wrap">

            <a
                class="btn btn-sm btn-outline-primary"
                href="/admin/users/{{ user.id }}/edit"
            >
                Edit
            </a>


            <form
                method="post"
                action="/admin/users/{{ user.id }}/toggle"
                hx-post="/admin/users/{{ user.id }}/toggle"
                hx-target="#user-row-{{ user.id }}"
                hx-swap="outerHTML"
            >
                <button
                    type="submit"
                    class="btn btn-sm btn-outline-secondary"
                >
                    {% if user.enabled %}
                        Disable
                    {% else %}
                        Enable
                    {% endif %}
                </button>
            </form>


            <form
                method="post"
                action="/admin/users/{{ user.id }}/rotate-token"
                hx-post="/admin/users/{{ user.id }}/rotate-token"
                hx-target="#user-row-{{ user.id }}"
                hx-swap="outerHTML"
                hx-confirm="Сгенерировать новый token? Старая ссылка перестанет работать."
            >
                <button
                    type="submit"
                    class="btn btn-sm btn-outline-warning"
                >
                    Rotate token
                </button>
            </form>


            <form
                method="post"
                action="/admin/users/{{ user.id }}/delete"
                hx-post="/admin/users/{{ user.id }}/delete"
                hx-target="#user-row-{{ user.id }}"
                hx-swap="outerHTML"
                hx-confirm="Удалить пользователя {{ user.display_name }}?"
            >
                <button
                    type="submit"
                    class="btn btn-sm btn-outline-danger"
                >
                    Delete
                </button>
            </form>

        </div>
    </td>
</tr>

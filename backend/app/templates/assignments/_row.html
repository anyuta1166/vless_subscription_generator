<tr
    id="assignment-row-{{ user.id }}-{{ server.id }}"
    class="{% if not server.enabled %}opacity-50{% endif %}"
>

    <td>
        <code>{{ server.server_id }}</code>

        {% if not server.enabled %}
            <div class="mt-1">
                <span class="badge text-bg-secondary">
                    Server disabled
                </span>
            </div>
        {% endif %}
    </td>


    <td>
        <code>
            {{ server.host }}:{{ server.port }}
        </code>
    </td>


    <td style="min-width: 390px;">

        {% if error %}
            <div class="alert alert-danger py-2 mb-2">
                {{ error }}
            </div>
        {% endif %}

        <input
            form="assignment-form-{{ user.id }}-{{ server.id }}"
            type="text"
            name="uuid"
            maxlength="36"
            placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            value="{{ assignment.uuid if assignment else '' }}"
            required
            class="form-control font-monospace"
        >

    </td>


    <td>

        <div class="form-check">

            <input
                form="assignment-form-{{ user.id }}-{{ server.id }}"
                class="form-check-input"
                type="checkbox"
                id="enabled-{{ user.id }}-{{ server.id }}"
                name="enabled"
                value="true"
                {% if not assignment or assignment.enabled %}
                    checked
                {% endif %}
            >

            <label
                class="form-check-label"
                for="enabled-{{ user.id }}-{{ server.id }}"
            >
                Enabled
            </label>

        </div>

    </td>


    <td>

        <div class="d-flex gap-2 flex-wrap">

            <form
                id="assignment-form-{{ user.id }}-{{ server.id }}"
                method="post"
                action="/admin/assignments/{{ user.id }}/{{ server.id }}"
                hx-post="/admin/assignments/{{ user.id }}/{{ server.id }}"
                hx-target="#assignment-row-{{ user.id }}-{{ server.id }}"
                hx-swap="outerHTML"
            >
                <button
                    type="submit"
                    class="btn btn-sm btn-primary"
                >
                    {% if assignment %}
                        Save
                    {% else %}
                        Add
                    {% endif %}
                </button>
            </form>


            {% if assignment %}

                <form
                    method="post"
                    action="/admin/assignments/{{ user.id }}/{{ server.id }}/delete"
                    hx-post="/admin/assignments/{{ user.id }}/{{ server.id }}/delete"
                    hx-target="#assignment-row-{{ user.id }}-{{ server.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="Удалить UUID пользователя {{ user.display_name }} с сервера {{ server.server_id }}?"
                >
                    <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                    >
                        Delete
                    </button>
                </form>

            {% endif %}

        </div>

    </td>

</tr>
